name: HomeHeat Model
version: "0.9.7"
slug: homeheat_model
description: Local thermal model trainer and shadow heating planner for HomeHeat.
arch:
  - aarch64
startup: application
boot: auto
init: false
homeassistant_api: true
map:
  - type: share
    read_only: false
options:
  db_path: /share/homeheat/homeheat.sqlite
  house_config_path: /share/homeheat/house_config.yaml
  status_path: /share/homeheat/model_status.json
  model_path: /share/homeheat/thermal_model.json
  timezone: Europe/Vilnius
  interval_minutes: 15
  grid_minutes: 10
  training_days: 30
  min_training_hours: 36
  min_heating_episodes: 2
  ridge_lambda: 0.25
  occupancy_calendar: calendar.kaimukas_occupancy
  test_heating_calendar: calendar.kaimukas_test_heating_plan
  live_heating_calendar: calendar.kaimukas_heating_plan
  write_test_calendar: true
  active_target_c: 25.0
  base_target_c: 10.0
  comfort_target_c: 21.5
  quiet_start: "22:00"
  quiet_end: "08:00"
  planning_horizon_hours: 72
  max_single_heat_minutes: 180
  occupancy_event_title: STAY
  base_margin_c: 0.5
  occupied_check_hours: 2
  max_proposals_per_cycle: 24
  planning_checkpoint_hours: 2
  proposal_reconcile: true
  pellet_forecast_days: 30
  pellet_lookback_days: 14
  pellet_daily_median_days: 7
  pellet_daily_min_coverage_hours: 18
  fuel_total_entity: sensor.naturela_burner_fuel_total
  fuel_stats_entity: sensor.naturela_burner_fuel_today_precise
  review_lead_hours: 12
  trajectory_step_hours: 2
  uncertainty_floor_c: 0.35
  uncertainty_growth_c_per_sqrt_hour: 0.12
  uncertainty_cap_c: 1.8
  physics_warming_guard: true
  constrained_fit_iterations: 800
  constrained_fit_tolerance: 0.0000000001
  rc_fit_max_hours: 96
  rc_min_segment_hours: 24
  rc_warmup_hours: 6
  rc_fit_max_nfev: 140
  rc_outdoor_loss_min_per_step: 0.001
  rc_outdoor_loss_prior_per_step: 0.0025
  rc_outdoor_loss_max_per_step: 0.02
  rc_planned_heat_equivalent: 0.85
  burner_startup_dead_minutes: 18
  burner_output_ramp_minutes: 8
  burner_residual_tail_minutes: 75
  planner_min_cycle_minutes: 60
  planner_start_penalty_equiv_minutes: 120
  planner_merge_gap_minutes: 120
  behavior_first_mode: true
  behavior_learning_days: 14
  behavior_default_start_local: "08:15"
  behavior_default_duration_minutes: 60
  behavior_min_cycle_minutes: 40
  behavior_max_cycle_minutes: 90
  behavior_start_hot_margin_c: 0.6
  behavior_weather_deadband_c: 3.0
  behavior_weather_step_c: 2.5
  behavior_weather_step_minutes: 10
  behavior_day_floor_c: 21.0
  behavior_sleep_floor_c: 20.5
  behavior_hard_day_floor_c: 20.2
  behavior_hard_sleep_floor_c: 19.5
  behavior_peak_soft_cap_c: 24.2
  human_feedback_enabled: true
  human_feedback_prior_weight: 1.5
  human_feedback_min_factor: 0.5
  human_feedback_max_factor: 1.4
  forecast_skill_lookback_days: 30
  forecast_skill_min_samples: 12
  forecast_actual_match_minutes: 45
  forecast_provider_match_hours: 3.1
  forecast_dashboard_hours: 168
  room_onboarding_min_hours: 36
  power_state_stale_minutes: 360
  internal_gain_min_history_hours: 24
  internal_gain_min_active_points: 6
  internal_gain_prior_c_per_step_per_kw: 0.04
  internal_gain_prior_sigma: 0.08
  internal_gain_max_c_per_step_per_kw: 0.40
